[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/agentkeep",
    "crates/agentkeep-common",
    "crates/agentkeep-policy",
    "crates/agentkeep-sandbox",
    "crates/agentkeep-proxy",
    "crates/agentkeep-mcp",
    "crates/agentkeep-scan",
    "crates/agentkeep-audit",
    "crates/agentkeep-tui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/amic25/Agentsecurityandsandboxing"
homepage = "https://github.com/amic25/Agentsecurityandsandboxing"
authors = ["agentkeep contributors"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["sandbox", "security", "ai-agents", "mcp", "prompt-injection"]

[workspace.dependencies]
# Internal crates
agentkeep-common = { path = "crates/agentkeep-common", version = "0.0.1" }
agentkeep-policy = { path = "crates/agentkeep-policy", version = "0.0.1" }
agentkeep-sandbox = { path = "crates/agentkeep-sandbox", version = "0.0.1" }
agentkeep-proxy = { path = "crates/agentkeep-proxy", version = "0.0.1" }
agentkeep-mcp = { path = "crates/agentkeep-mcp", version = "0.0.1" }
agentkeep-scan = { path = "crates/agentkeep-scan", version = "0.0.1" }
agentkeep-audit = { path = "crates/agentkeep-audit", version = "0.0.1" }
agentkeep-tui = { path = "crates/agentkeep-tui", version = "0.0.1" }

# External. Every entry here must have a justification in docs/dependencies.md.
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
globset = "0.4"
libc = "0.2"
landlock = "0.4"
proptest = "1"
rustix = { version = "1", features = ["fs", "mount", "process", "thread", "system", "net", "pipe", "stdio"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
debug = 1

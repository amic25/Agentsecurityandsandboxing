name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: bash scripts/toolchain-channel.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # `backend` is the sandbox the escape suite must exercise on that
        # runner; empty means none exists there yet (UNTESTED is allowed).
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            backend: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            backend: linux
          - name: macos-intel
            os: macos-15-intel
            backend: macos
          - name: macos-arm64
            os: macos-15
            backend: macos
          - name: windows-x86_64
            os: windows-2025
            backend: ""
    runs-on: ${{ matrix.os }}
    env:
      # Where a backend exists the sandbox must actually be exercised:
      # UNTESTED is a failure, and the suite runs against that backend only.
      AGENTKEEP_REQUIRE_SANDBOX: ${{ matrix.backend != '' && '1' || '' }}
      AGENTKEEP_ESCAPE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        shell: bash
        run: bash scripts/toolchain-channel.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Allow unprivileged user namespaces (Ubuntu runners restrict them)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Tools the network escape tests drive (S5 runs under strace)
        if: runner.os == 'Linux'
        run: |
          for t in curl python3 strace; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "${missing:-}" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $missing; fi
      - run: cargo build --workspace --locked
      - name: Which backends work here
        shell: bash
        run: |
          uname -a
          if [ "$RUNNER_OS" = "macOS" ]; then sw_vers; fi
          cargo run --locked --quiet -- doctor || true
      - name: Unit, property and escape tests
        shell: bash
        run: cargo test --workspace --locked -- --nocapture
      - name: Escape suite summary
        if: runner.os != 'Windows'
        run: tests/escape/run.sh
      - name: Seatbelt denials (for diagnosing a failed macOS run)
        if: failure() && runner.os == 'macOS'
        run: |
          log show --style compact --last 30m \
            --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny("' \
            | tail -n 400 || true
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --help
          cargo run --locked --quiet -- version
          # Unimplemented commands must exit 70, never 0.
          if cargo run --locked --quiet -- scan . ; then
            echo "stub returned success" >&2; exit 1
          fi

  escape-container:
    # The full escape suite against the container backend. Docker (rootful,
    # preinstalled on the runner) is required to pass; rootless Podman with
    # crun on cgroup v2 has not been verified anywhere else yet, so it runs
    # as an experiment that reports without blocking.
    name: escape suite (container backend, ${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            experimental: false
          - runtime: podman
            experimental: true
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: bash scripts/toolchain-channel.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Container runtime info
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: '"$RUNTIME" info'
      - name: Keep rootless runtime state in the real home
        # The escape harness gives every test a fake HOME; without this,
        # rootless Podman would create fresh storage inside each one.
        run: echo "XDG_DATA_HOME=$HOME/.local/share" >> "$GITHUB_ENV"
      - run: cargo build --workspace --locked
      - name: Escape suite against the container backend
        env:
          AGENTKEEP_ESCAPE_BACKEND: container
          AGENTKEEP_CONTAINER_RUNTIME: ${{ matrix.runtime }}
          AGENTKEEP_REQUIRE_SANDBOX: "1"
        run: tests/escape/run.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit has a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  workflows-are-pinned:
    name: actions pinned by SHA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-pinned-actions.sh

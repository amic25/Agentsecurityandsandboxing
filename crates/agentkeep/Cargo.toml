[package]
name = "agentkeep"
description = "A drop-in security layer for AI coding agents: sandbox, egress proxy, MCP gateway, scanner and audit log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "../../README.md"
default-run = "agentkeep"

[[bin]]
name = "agentkeep"
path = "src/main.rs"

[dependencies]
agentkeep-audit = { workspace = true }
agentkeep-common = { workspace = true }
agentkeep-mcp = { workspace = true }
agentkeep-policy = { workspace = true }
agentkeep-proxy = { workspace = true }
agentkeep-sandbox = { workspace = true }
agentkeep-scan = { workspace = true }
agentkeep-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Local TLS origins for the network escape tests; both are already in the
# build through agentkeep-proxy.
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

id: ci-workflow/agent-untrusted-trigger-write-token
severity: critical
title: AI agent in CI driven by untrusted events with a write token
description: >
  A workflow triggered by comments, issues, discussions, reviews or
  pull_request_target runs an AI agent on text that anyone can write, while
  its GITHUB_TOKEN can push code, edit issues or publish packages. A prompt
  injection in that text can make the agent use the token: push a backdoor,
  leak secrets into a comment or approve its own change. A job without any
  permissions block is reported too, because the default token may be
  write-enabled in the repository settings.
applies_to:
  - ".github/workflows/*.yml"
  - ".github/workflows/*.yaml"
detect:
  builtin: ci_agent_token_exposure
remediation: >
  Set `permissions:` to read-only (`contents: read`) and add only the
  narrow write scope the job needs, if any; gate the job with an `if:` on
  `author_association` (OWNER, MEMBER, COLLABORATOR) or the action's
  allowed-users input; never interpolate event text into prompts or
  scripts with `${{ }}`.
references:
  - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
tags: [ci, github-actions, prompt-injection, supply-chain]
examples:
  match:
    - path: .github/workflows/claude.yml
      content: |
        on:
          issue_comment:
            types: [created]
        permissions:
          contents: write
          pull-requests: write
        jobs:
          claude:
            if: contains(github.event.comment.body, '@claude')
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1
                with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    - path: .github/workflows/triage.yaml
      content: |
        on: pull_request_target
        jobs:
          triage:
            runs-on: ubuntu-latest
            steps:
              - run: |
                  npx -y @openai/codex exec "Label this PR: ${{ github.event.pull_request.title }}"
  nomatch:
    - path: .github/workflows/claude.yml
      content: |
        on:
          issue_comment:
            types: [created]
        permissions:
          contents: write
        jobs:
          claude:
            if: github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER'
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1
    - path: .github/workflows/review.yml
      content: |
        on:
          push:
            branches: [main]
        permissions:
          contents: write
        jobs:
          review:
            runs-on: ubuntu-latest
            steps:
              - uses: anthropics/claude-code-action@v1
    - path: .github/workflows/labeler.yml
      content: |
        on: pull_request_target
        permissions:
          pull-requests: write
        jobs:
          label:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/labeler@v5

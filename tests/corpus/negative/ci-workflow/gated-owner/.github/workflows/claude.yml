name: claude
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  claude:
    if: github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1

# cargo-deny configuration. Run with `cargo deny check`.
# Every allowance below must have a comment explaining why.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Copyleft is not acceptable for a static binary
# that companies will redistribute internally.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = [
  # The Mozilla CA root list, used by the proxy to verify origins. CDLA
  # Permissive 2.0 is a permissive data licence; scoped to this crate only.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want to see in the tree.
deny = [
  # Uses C OpenSSL; we use rustls only so the binary stays static and auditable.
  { crate = "openssl", reason = "rustls only" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "native-tls", reason = "rustls only" },
  # Telemetry and network-calling crates are not allowed; agentkeep makes no
  # network calls of its own.
  { crate = "sentry", reason = "no telemetry" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
